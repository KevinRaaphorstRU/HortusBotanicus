<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Time Slider Map</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
}

#map {
    width: 100%;
    height: 100vh;
}

.control-panel {
    position: absolute;
    top: 10px;
    left: 50px;
    z-index: 1000;
    background: white;
    padding: 10px;
    border-radius: 5px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    max-width: 400px;
}

#yearLabel {
    font-weight: bold;
    margin-top: 5px;
}

#debug {
    font-size: 12px;
    margin-top: 10px;
    background: #f0f0f0;
    padding: 5px;
    border-radius: 3px;
    max-height: 200px;
    overflow-y: auto;
}
</style>
</head>

<body>

<div class="control-panel">
    <input type="range" id="slider">
    <div id="yearLabel"></div>
    <div id="debug"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([52.1, 5.2], 8);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);

let currentLayer;
let allData;
let debugLog = [];

function addDebug(msg) {
    console.log(msg);
    debugLog.push(msg);
    const debugDiv = document.getElementById('debug');
    if (debugDiv) {
        debugDiv.textContent = debugLog.slice(-10).join('\n');
        debugDiv.scrollTop = debugDiv.scrollHeight;
    }
}

function getFeatureColor(feature, month) {
    const buffDist = feature.properties ? feature.properties.BUFF_DIST : null;
    let color = '#95a5a6'; // default gray
    
    // Month-specific symbology based on BUFF_DIST (10 or 25)
    if (month === 3) {
        color = buffDist === 25 ? '#2ecc71' : '#f1c40f'; // green for 25, yellow for 10
    } else if (month === 4) {
        color = buffDist === 25 ? '#f1c40f' : '#e74c3c'; // yellow for 25, red for 10
    } else if (month === 5) {
        color = buffDist === 25 ? '#2ecc71' : '#f1c40f'; // green for 25, yellow for 10
    }
    
    return color;
}

function createStyledLayer(features, month) {
    addDebug('Creating layer with ' + features.length + ' features for month ' + month);
    
    const geoJsonFeatureCollection = {
        type: "FeatureCollection",
        features: features
    };
    
    const layer = L.geoJSON(geoJsonFeatureCollection, {
        style: function(feature) {
            const color = getFeatureColor(feature, month);
            return {
                color: color,
                weight: 2,
                opacity: 0.8,
                fill: true,
                fillColor: color,
                fillOpacity: 0.7
            };
        },
        onEachFeature: function(feature, layer) {
            if (feature.properties) {
                let popup = '<div>';
                Object.keys(feature.properties).forEach(key => {
                    popup += `<b>${key}:</b> ${feature.properties[key]}<br>`;
                });
                popup += '</div>';
                layer.bindPopup(popup);
            }
        }
    });
    
    return layer;
}

fetch('/HortusBotanicus/HortusBetula.json')
.then(response => {
    if (!response.ok) throw new Error('Network response was not ok: ' + response.status);
    return response.json();
})
.then(data => {
    addDebug('✓ Data loaded: ' + data.features.length + ' features');
    
    // Log sample BUFF_DIST values
    const buffDistValues = [...new Set(data.features.map(f => f.properties.BUFF_DIST))];
    addDebug('BUFF_DIST values in data: ' + buffDistValues.join(', '));
    
    allData = data;

    const periods = [
        ...new Set(
            data.features.map(f => f.properties && f.properties.Maand)
        )
    ].filter(v => v !== undefined && v !== null).sort();

    addDebug('✓ Periods found: ' + periods.join(', '));
    
    const slider = document.getElementById('slider');

    if (periods.length === 0) {
        addDebug('✗ No data available');
        slider.disabled = true;
        return;
    }

    slider.min = 0;
    slider.max = periods.length - 1;
    slider.step = 1;
    slider.value = 0;
    slider.disabled = false;

    function updateMap(index) {
        index = Number(index);
        const selectedValue = periods[index];

        document.getElementById('yearLabel').textContent = "Month: " + selectedValue;

        const filteredFeatures = data.features.filter(
            f => f.properties && f.properties.Maand == selectedValue
        );

        addDebug('Month ' + selectedValue + ': ' + filteredFeatures.length + ' features');

        if (currentLayer) {
            map.removeLayer(currentLayer);
        }

        currentLayer = createStyledLayer(filteredFeatures, selectedValue);
        currentLayer.addTo(map);

        if (currentLayer.getLayers().length > 0) {
            try {
                map.fitBounds(currentLayer.getBounds());
            } catch (e) {
                addDebug('Error fitting bounds: ' + e.message);
            }
        }
    }

    updateMap(0);

    slider.addEventListener("input", function() {
        updateMap(this.value);
    });

})
.catch(error => {
    addDebug('✗ Error: ' + error.message);
});

</script>

</body>
</html>
