<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pollenrisico</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
}

#map {
    width: 100%;
    height: 100vh;
}

.control-panel {
    position: absolute;
    top: 10px;
    left: 50px;
    z-index: 1000;
    background: white;
    padding: 10px;
    border-radius: 5px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}

#yearLabel {
    font-weight: bold;
    margin-top: 5px;
}

#sliderLabels {
    display: grid;
    gap: 4px;
    font-size: 12px;
    text-align: center;
    margin-top: 4px;
}

#sliderLabels span {
    white-space: nowrap;
}

.info.legend {
    background: white;
    padding: 10px 12px;
    border-radius: 5px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    font-size: 13px;
    line-height: 1.4;
}

.info.legend h4 {
    margin: 0 0 8px;
    font-size: 14px;
}

.legend-swatch {
    display: inline-block;
    width: 14px;
    height: 14px;
    margin-right: 8px;
    border: 1px solid #999;
    vertical-align: middle;
}
</style>
</head>

<body>

<div class="control-panel">
    <input type="range" id="slider" aria-label="Maand">
    <div id="sliderLabels"></div>
    <div id="yearLabel"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([52.1, 5.2], 8);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);

const legend = L.control({ position: 'bottomright' });

legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'info legend');
    div.innerHTML = `
        <h4>Pollenrisico</h4>
        <div><span class="legend-swatch" style="background:#2ecc71;"></span> laag</div>
        <div><span class="legend-swatch" style="background:#f1c40f;"></span> gemiddeld</div>
        <div><span class="legend-swatch" style="background:#e74c3c;"></span> hoog</div>
    `;
    return div;
};

legend.addTo(map);

let currentLayer;

function getFeatureColor(feature, month) {
    const buffDist = feature.properties ? feature.properties.BUFF_DIST : null;
    let color = '#95a5a6'; // default gray
    
    // Month-specific symbology based on BUFF_DIST (10 or 25)
    if (month === 3) {
        color = buffDist === 25 ? '#2ecc71' : '#f1c40f'; // green for 25, yellow for 10
    } else if (month === 4) {
        color = buffDist === 25 ? '#f1c40f' : '#e74c3c'; // yellow for 25, red for 10
    } else if (month === 5) {
        color = buffDist === 25 ? '#2ecc71' : '#f1c40f'; // green for 25, yellow for 10
    }
    
    return color;
}

function createStyledLayer(features, month) {
    const geoJsonFeatureCollection = {
        type: "FeatureCollection",
        features: features
    };
    
    const layer = L.geoJSON(geoJsonFeatureCollection, {
        style: function(feature) {
            const color = getFeatureColor(feature, month);
            return {
                color: color,
                weight: 2,
                opacity: 0.8,
                fill: true,
                fillColor: color,
                fillOpacity: 0.7
            };
        },
        onEachFeature: function(feature, layer) {
            if (feature.properties) {
                let popup = '<div>';
                Object.keys(feature.properties).forEach(key => {
                    popup += `<b>${key}:</b> ${feature.properties[key]}<br>`;
                });
                popup += '</div>';
                layer.bindPopup(popup);
            }
        }
    });
    
    return layer;
}

fetch('/HortusBotanicus/HortusBetula.json')
.then(response => {
    if (!response.ok) throw new Error('Network response was not ok: ' + response.status);
    return response.json();
})
.then(data => {
    const periods = [
        ...new Set(
            data.features.map(f => f.properties && f.properties.Maand)
        )
    ].filter(v => v !== undefined && v !== null).sort((a, b) => {
        const aNumber = Number(a);
        const bNumber = Number(b);

        if (!Number.isNaN(aNumber) && !Number.isNaN(bNumber)) {
            return aNumber - bNumber;
        }

        return String(a).localeCompare(String(b), 'nl');
    });
    
    const slider = document.getElementById('slider');
    const sliderLabels = document.getElementById('sliderLabels');
    const yearLabel = document.getElementById('yearLabel');
    const monthNames = {
        1: "Januari",
        2: "Februari",
        3: "Maart",
        4: "April",
        5: "Mei",
        6: "Juni",
        7: "Juli",
        8: "Augustus",
        9: "September",
        10: "Oktober",
        11: "November",
        12: "December"
    };

    if (periods.length === 0) {
        sliderLabels.replaceChildren();
        yearLabel.textContent = "No data available";
        slider.setAttribute('aria-valuetext', "No data available");
        slider.disabled = true;
        return;
    }

    slider.min = 0;
    slider.max = periods.length - 1;
    slider.step = 1;
    slider.value = 0;
    slider.disabled = false;
    sliderLabels.style.gridTemplateColumns = `repeat(${periods.length}, 1fr)`;
    sliderLabels.replaceChildren(...periods.map(month => {
        const label = document.createElement('span');
        label.textContent = monthNames[Number(month)] || month;
        return label;
    }));

    function updateMap(index) {
        index = Number(index);
        const selectedValue = periods[index];
        const monthLabel = monthNames[Number(selectedValue)] || selectedValue;

        yearLabel.textContent = "Maand: " + monthLabel;
        slider.setAttribute('aria-valuetext', monthLabel);

        const filteredFeatures = data.features.filter(
            f => f.properties && f.properties.Maand == selectedValue
        );

        if (currentLayer) {
            map.removeLayer(currentLayer);
        }

        currentLayer = createStyledLayer(filteredFeatures, selectedValue);
        currentLayer.addTo(map);

        if (currentLayer.getLayers().length > 0) {
            try {
                map.fitBounds(currentLayer.getBounds());
            } catch (e) {
                console.error('Error fitting bounds:', e.message);
            }
        }
    }

    updateMap(0);

    slider.addEventListener("input", function() {
        updateMap(this.value);
    });

})
.catch(error => {
    console.error("GeoJSON loading error:", error);
    const slider = document.getElementById('slider');
    document.getElementById('sliderLabels').replaceChildren();
    document.getElementById('yearLabel').textContent = "Error loading data";
    slider.disabled = true;
    slider.setAttribute('aria-valuetext', "Error loading data");
});

</script>

</body>
</html>
