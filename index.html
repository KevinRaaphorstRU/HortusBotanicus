<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Time Slider Map</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
}

#map {
    width: 100%;
    height: 100vh;
}

.control-panel {
    position: absolute;
    top: 10px;
    left: 50px;
    z-index: 1000;
    background: white;
    padding: 10px;
    border-radius: 5px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}

#yearLabel {
    font-weight: bold;
    margin-top: 5px;
}
</style>
</head>

<body>

<div class="control-panel">
    <input type="range" id="slider">
    <div id="yearLabel"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([52.1, 5.2], 8);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);

let currentLayer;

fetch('HortusBetula.geojson')
.then(response => response.json())
.then(data => {

    const periods = [
        ...new Set(
            data.features.map(f => f.properties.year)
        )
    ].sort();

    const slider = document.getElementById('slider');

    slider.min = 0;
    slider.max = periods.length - 1;
    slider.value = 0;

    function updateMap(index) {

        const selectedValue = periods[index];

        document.getElementById('yearLabel').textContent =
            "Period: " + selectedValue;

        const filteredFeatures = {
            type: "FeatureCollection",
            features: data.features.filter(
                f => f.properties.year == selectedValue
            )
        };

        if (currentLayer) {
            map.removeLayer(currentLayer);
        }

        currentLayer = L.geoJSON(filteredFeatures).addTo(map);

        if (currentLayer.getLayers().length > 0) {
            map.fitBounds(currentLayer.getBounds());
        }
    }

    updateMap(0);

    slider.addEventListener("input", function() {
        updateMap(this.value);
    });

})
.catch(error => {
    console.error("GeoJSON loading error:", error);
});

</script>

</body>
</html>
