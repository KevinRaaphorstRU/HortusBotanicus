<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Time Slider Map</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
}

#map {
    width: 100%;
    height: 100vh;
}

.control-panel {
    position: absolute;
    top: 10px;
    left: 50px;
    z-index: 1000;
    background: white;
    padding: 10px;
    border-radius: 5px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}

#yearLabel {
    font-weight: bold;
    margin-top: 5px;
}
</style>
</head>

<body>

<div class="control-panel">
    <input type="range" id="slider">
    <div id="yearLabel"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([52.1, 5.2], 8);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);

let currentLayer;

function getFeatureStyle(feature, month) {
    let color = '#95a5a6'; // default gray
    
    // Month 4 (April): red
    if (month === 4) {
        color = '#e74c3c'; // Red
    }
    
    // If name contains "25": yellow
    if (feature.properties && feature.properties.name && String(feature.properties.name).includes('25')) {
        color = '#f1c40f'; // Yellow
    }
    
    return {
        color: color,
        weight: 2,
        opacity: 0.8,
        fill: true,
        fillColor: color,
        fillOpacity: 0.7,
        radius: 6
    };
}

function pointToLayer(feature, latlng, month) {
    const style = getFeatureStyle(feature, month);
    return L.circleMarker(latlng, {
        radius: style.radius,
        fillColor: style.fillColor,
        color: style.color,
        weight: style.weight,
        opacity: style.opacity,
        fillOpacity: style.fillOpacity
    });
}

function onEachFeature(feature, layer) {
    if (feature.properties) {
        let popup = '<div>';
        Object.keys(feature.properties).forEach(key => {
            popup += `<b>${key}:</b> ${feature.properties[key]}<br>`;
        });
        popup += '</div>';
        layer.bindPopup(popup);
    }
}

fetch('/HortusBotanicus/HortusBetula.json')
.then(response => {
    if (!response.ok) throw new Error('Network response was not ok: ' + response.status);
    return response.json();
})
.then(data => {

    const periods = [
        ...new Set(
            data.features.map(f => f.properties && f.properties.Maand)
        )
    ].filter(v => v !== undefined && v !== null).sort();

    const slider = document.getElementById('slider');

    if (periods.length === 0) {
        document.getElementById('yearLabel').textContent = "No data available";
        slider.disabled = true;
        return;
    }

    slider.min = 0;
    slider.max = periods.length - 1;
    slider.step = 1;
    slider.value = 0;
    slider.disabled = false;

    function updateMap(index) {
        index = Number(index); // ensure numeric
        const selectedValue = periods[index];

        document.getElementById('yearLabel').textContent =
            "Month: " + selectedValue;

        const filteredFeatures = {
            type: "FeatureCollection",
            features: data.features.filter(
                f => f.properties && f.properties.Maand == selectedValue
            )
        };

        if (currentLayer) {
            map.removeLayer(currentLayer);
        }

        currentLayer = L.geoJSON(filteredFeatures, {
            pointToLayer: function(feature, latlng) {
                return pointToLayer(feature, latlng, selectedValue);
            },
            onEachFeature: onEachFeature
        }).addTo(map);

        if (currentLayer.getLayers().length > 0) {
            map.fitBounds(currentLayer.getBounds());
        }
    }

    updateMap(0);

    slider.addEventListener("input", function() {
        updateMap(this.value);
    });

})
.catch(error => {
    console.error("GeoJSON loading error:", error);
    document.getElementById('yearLabel').textContent = "Error loading data (see console)";
});

</script>

</body>
</html>
