<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Time Slider Map</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html;
    height: 100%;
}

#map {
    width: 100%;
    height: 100%;
}

.control-panel {
    position: absolute;
    top: 10px;
    left: 50px;
    z-index: 1000;

    background: white;
    padding: 10px;
    border-radius: 5px;

    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}

#yearLabel {
    font-weight: bold;
    margin-top: 5px;
}
</style>
</head>

<body>

<div class="control-panel">
    <input type="range" id="slider">
    <div id="yearLabel"></div>
</div>

<div id="map"></div>

https://unpkg.com/leaflet/dist/leaflet.jsscript>

<script>

const map = L.map('map').setView([52.1, 5.2], 8);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap'
    }
).addTo(map);

let geojsonData;
let currentLayer;

fetch('data.geojson')
.then(response => response.json())
.then(data => {

    geojsonData = data;

    // Get unique values from attribute
    const periods = [
        ...new Set(
            data.features.map(f => f.properties.year)
        )
    ].sort();

    const slider = document.getElementById('slider');

    slider.min = 0;
    slider.max = periods.length - 1;
    slider.value = 0;

    function updateMap(index){

        const selectedValue = periods[index];

        document.getElementById('yearLabel').innerHTML =
            "Period: " + selectedValue;

        const filteredFeatures = {
            type: "FeatureCollection",
            features: data.features.filter(
                f => f.properties.year == selectedValue
            )
        };

        if(currentLayer){
            map.removeLayer(currentLayer);
        }

        currentLayer = L.geoJSON(filteredFeatures, {

            style: {
                color: "#ff6600",
                weight: 2,
                fillOpacity: 0.5
            },

            onEachFeature: function(feature, layer){

                let content = "";

                for(const key in feature.properties){
                    content +=
                        "<b>" + key + "</b>: "
                        + feature.properties[key]
                        + "<br>";
                }

                layer.bindPopup(content);
            }

        }).addTo(map);

        map.fitBounds(currentLayer.getBounds());
    }

    updateMap(0);

    slider.addEventListener("input", function(){
        updateMap(this.value);
    });

});

</script>

</body>
</html>
