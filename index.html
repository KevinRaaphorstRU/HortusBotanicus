<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Time Slider Map</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
}

#map {
    width: 100%;
    height: 100vh;
}

.control-panel {
    position: absolute;
    top: 10px;
    left: 50px;
    z-index: 1000;
    background: white;
    padding: 10px;
    border-radius: 5px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}

#yearLabel {
    font-weight: bold;
    margin-top: 5px;
}

#debug {
    font-size: 12px;
    margin-top: 10px;
    max-width: 300px;
}
</style>
</head>

<body>

<div class="control-panel">
    <input type="range" id="slider">
    <div id="yearLabel"></div>
    <div id="debug"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([52.1, 5.2], 8);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);

let currentLayer;
let allData;

function getFeatureStyle(feature, month) {
    let color = '#95a5a6'; // default gray
    const has25 = feature.properties && feature.properties.BUFF_DIST === 25;
    
    console.log('Styling feature for month', month, '- BUFF_DIST:', feature.properties.BUFF_DIST, '- has25:', has25);
    
    // Month-specific symbology
    if (month === 3) {
        // Month 3: green when BUFF_DIST is 25, yellow if not
        color = has25 ? '#2ecc71' : '#f1c40f';
    } else if (month === 4) {
        // Month 4: yellow when BUFF_DIST is 25, red if not
        color = has25 ? '#f1c40f' : '#e74c3c';
    } else if (month === 5) {
        // Month 5: green when BUFF_DIST is 25, yellow if not
        color = has25 ? '#2ecc71' : '#f1c40f';
    }
    
    console.log('Color assigned:', color);
    
    return {
        color: color,
        weight: 2,
        opacity: 0.8,
        fill: true,
        fillColor: color,
        fillOpacity: 0.7
    };
}

function onEachFeature(feature, layer) {
    if (feature.properties) {
        let popup = '<div>';
        Object.keys(feature.properties).forEach(key => {
            popup += `<b>${key}:</b> ${feature.properties[key]}<br>`;
        });
        popup += '</div>';
        layer.bindPopup(popup);
    }
}

fetch('/HortusBotanicus/HortusBetula.json')
.then(response => {
    if (!response.ok) throw new Error('Network response was not ok: ' + response.status);
    return response.json();
})
.then(data => {
    console.log('Data loaded:', data);
    allData = data;

    const periods = [
        ...new Set(
            data.features.map(f => f.properties && f.properties.Maand)
        )
    ].filter(v => v !== undefined && v !== null).sort();

    console.log('Periods found:', periods);
    
    const slider = document.getElementById('slider');
    const debug = document.getElementById('debug');

    if (periods.length === 0) {
        document.getElementById('yearLabel').textContent = "No data available";
        slider.disabled = true;
        return;
    }

    slider.min = 0;
    slider.max = periods.length - 1;
    slider.step = 1;
    slider.value = 0;
    slider.disabled = false;

    function updateMap(index) {
        index = Number(index); // ensure numeric
        const selectedValue = periods[index];

        document.getElementById('yearLabel').textContent =
            "Month: " + selectedValue;

        debug.textContent = "Month: " + selectedValue + " | Features: " + allData.features.filter(f => f.properties && f.properties.Maand == selectedValue).length;

        const filteredFeatures = {
            type: "FeatureCollection",
            features: data.features.filter(
                f => f.properties && f.properties.Maand == selectedValue
            )
        };

        console.log('Filtered features for month', selectedValue, ':', filteredFeatures.features.length);

        if (currentLayer) {
            map.removeLayer(currentLayer);
        }

        currentLayer = L.geoJSON(filteredFeatures, {
            style: function(feature) {
                return getFeatureStyle(feature, selectedValue);
            },
            onEachFeature: onEachFeature
        }).addTo(map);

        if (currentLayer.getLayers().length > 0) {
            map.fitBounds(currentLayer.getBounds());
        }
    }

    updateMap(0);

    slider.addEventListener("input", function() {
        updateMap(this.value);
    });

})
.catch(error => {
    console.error("GeoJSON loading error:", error);
    document.getElementById('yearLabel').textContent = "Error loading data (see console)";
    document.getElementById('debug').textContent = error.message;
});

</script>

</body>
</html>
